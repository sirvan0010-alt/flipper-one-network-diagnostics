name: Python checks

on:
  push:
    branches: [main, arm64-runtime-validation]
  pull_request:
    branches: [main, pre-device-foundation]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - name: Assemble deployable FlipCTL app
        run: python scripts/package_flipctl_app.py --output "$RUNNER_TEMP/Network Diagnostics"
      - name: Upload app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: network-diagnostics-flipctl-app
          path: ${{ runner.temp }}/Network Diagnostics/
          if-no-files-found: error

  arm64-runtime:
    # Native ARM64 runner: this validates Linux/ARM64 packaging and runtime,
    # but it is not a substitute for a smoke test on the Flipper One itself.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify native ARM64 environment
        run: |
          test "$(uname -m)" = "aarch64"
          python -c "import platform; assert platform.machine() in ('aarch64', 'arm64'), platform.machine(); print(platform.python_version(), platform.machine())"
      - name: Install test tooling
        run: python -m pip install -e ".[dev]"
      - name: Run tests and lint on ARM64
        run: |
          pytest
          ruff check .
      - name: Build universal wheel
        run: |
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheelhouse"
          python -c "from pathlib import Path; wheels=list(Path('$RUNNER_TEMP/wheelhouse').glob('*.whl')); assert len(wheels)==1, wheels; assert wheels[0].name.endswith('py3-none-any.whl'), wheels[0].name; print(wheels[0].name)"
      - name: Verify clean offline installation and SQLite runtime
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          WHEEL="$(find "$RUNNER_TEMP/wheelhouse" -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install --no-index --no-deps "$WHEEL"
          "$RUNNER_TEMP/clean-venv/bin/python" -c "import platform, sqlite3, flipper_diag; assert platform.machine() in ('aarch64', 'arm64'); print('ARM64 clean install; SQLite', sqlite3.sqlite_version)"
          "$RUNNER_TEMP/clean-venv/bin/flipper-diag" doctor --json
      - name: Assemble standalone FlipCTL app bundle
        run: |
          python scripts/package_flipctl_app.py --output "$RUNNER_TEMP/Network Diagnostics"
          test -f "$RUNNER_TEMP/Network Diagnostics/network-diagnostics.fap.py"
          test -d "$RUNNER_TEMP/Network Diagnostics/flipper_diag"
      - name: Import packaged core without site packages
        env:
          PYTHONPATH: ${{ runner.temp }}/Network Diagnostics
        run: |
          "$RUNNER_TEMP/clean-venv/bin/python" -S -c "import importlib, pkgutil, flipper_diag; [importlib.import_module(m.name) for m in pkgutil.iter_modules(flipper_diag.__path__, 'flipper_diag.')]; print('Bundled core imports:', flipper_diag.__version__)"

  docs-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Validate local Markdown links, images and anchors
        run: python scripts/validate_docs.py
