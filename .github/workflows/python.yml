name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - name: Assemble deployable FlipCTL app
        run: python scripts/package_flipctl_app.py --output "$RUNNER_TEMP/Network Diagnostics"
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: network-diagnostics-flipctl-app
          path: ${{ runner.temp }}/Network Diagnostics/
          if-no-files-found: error
