name: Python security checks

on:
  push:
    branches: [main, pre-device-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 5 * * 1"

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install project and audit tools
        run: python -m pip install -e ".[dev]" pip-audit bandit
      - name: Audit installed Python dependencies
        run: pip-audit --strict --skip-editable
      - name: Scan project code for high-severity security issues
        run: bandit -r src apps scripts -lll
      - name: Compile Python sources
        run: python -m compileall -q src apps scripts
